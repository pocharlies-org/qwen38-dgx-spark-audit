# Si el anillo cambia, se copia otra vez con su commit y su sha256: test_patch_roce_ring.py lo comprueba.
# ring.conf — la ÚNICA tabla del anillo ConnectX-7 entre los tres Sparks (INFRA-741).
# La leen ring-apply.sh, ring-remove.sh, ring-gate.sh e install.sh; tests/test_roce_ring_contract.py
# la valida. Superficie que no se renombra: el formato y los nombres de la última columna (hay que
# añadir una fila nueva, no editar una que ya se aplicó).
#
# Columnas, separadas por espacios (9; "-" = no aplica):
#   kind  ring = lo gestiona el anillo (keyfile de NetworkManager, una fila por netdev);
#         tp   = IP que YA existe en el puerto 0 de dgx1/dgx2 (netplan; el anillo NO la toca: solo
#                da nombre en /etc/hosts y entra en la comprobación de subredes y en el gate)
#   host  `hostname -s` del nodo (en k8s dgx1 es nvidia-dgx y dgx2 es gx10-ec3d; el alias ssh es dgx1/dgx2/dgx3)
#   netdev, rdma  netdev y dispositivo RDMA de esa función (misma función PCIe)
#   cidr  IP/24 del netdev      peer  nodo del otro extremo      half  A = 0000:01:00.x, B = 0002:01:00.x
#   uuid  UUID fijo del keyfile (ring)      name  nombre en /etc/hosts: cx7-<host>-<peer>-<half>
#
# Mapa de cables medido en P1 (adjunto 22139 de INFRA-741): los dos netdevs del puerto 0 de dgx3 van al
# puerto 1 de dgx1, y los del puerto 1 de dgx3 al puerto 1 de dgx2. En dgx1 y dgx2 solo se usa el
# puerto 1: el puerto 0 es el enlace del TP (qwen38) y no tiene fila "ring".
#
# kind host netdev        rdma         cidr         peer half uuid                                 name
ring   dgx1 enp1s0f1np1   rocep1s0f1   10.0.2.1/24  dgx3 A    9c787846-ca5e-466d-aeec-375822a1c629 cx7-dgx1-dgx3-a
