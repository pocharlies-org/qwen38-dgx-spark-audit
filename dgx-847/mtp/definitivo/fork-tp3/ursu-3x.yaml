        - {name: mtp-vocab-es, mountPath: /opt/mtp-vocab-es, readOnly: true}
        - {name: xdg, mountPath: /cache/xdg}
        - {name: nccl-ring, mountPath: /opt/nccl-ring, subPath: opt/nccl-ring, readOnly: true}
